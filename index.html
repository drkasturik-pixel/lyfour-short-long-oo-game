<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Long and Short OO Sounds</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="splashScreen">
    <div class="logo-container">
        <img src="assets/innovine-logo.png" alt="Innovine Logo" id="logo">
    </div>
</div>

<div id="gameContainer" class="hidden">

    <header>
        <h1>Long and Short "oo" Sounds</h1>

        <div id="instructions">
            <p><strong>Tap the picture to hear the word.</strong></p>
            <p>Then tap the correct monster.</p>
            <p>📘 <strong>BOOK MONSTER</strong> = short "oo" like <strong>book</strong></p>
            <p>🌙 <strong>MOON MONSTER</strong> = long "oo" like <strong>moon</strong></p>
        </div>

        <div id="topBar">
            <button id="replayInstructionsBtn" type="button">🔊 Instructions</button>
            <button id="replayWordBtn" type="button">🔈 Hear Word</button>
            <div id="scoreBox">Score: <span id="scoreValue">0</span>/18</div>
        </div>
    </header>

    <main>
        <section id="monsterArea">

            <button id="bookMonster" class="monster drop-zone" data-answer="short" type="button">
                <img src="assets/book-monster.png" alt="Book Monster">
                <span class="monsterTitle">BOOK MONSTER</span>
                <span class="monsterText">Short "oo" like BOOK</span>
            </button>

            <button id="moonMonster" class="monster drop-zone" data-answer="long" type="button">
                <img src="assets/moon-monster.png" alt="Moon Monster">
                <span class="monsterTitle">MOON MONSTER</span>
                <span class="monsterText">Long "oo" like MOON</span>
            </button>

        </section>

        <div id="feedbackLayer">
            <div id="correctFeedback" class="feedback hidden">
                <div class="big-icon">✅</div>
                <div class="feedback-text">Great Job!</div>
                <div class="claps">👏 👏 👏</div>
            </div>

            <div id="wrongFeedback" class="feedback hidden">
                <div class="big-icon">❌</div>
                <div class="feedback-text">Try Again</div>
            </div>
        </div>

        <section id="cardSection">
            <button id="wordCard" type="button" aria-label="Hear the word">
                <span id="tapHint">TAP TO HEAR</span>
                <img id="cardImage" src="" alt="">
                <div id="cardWord">WORD</div>
                <span id="speakerButton">🔊</span>
            </button>
        </section>
    </main>
</div>

<div id="endScreen" class="hidden">
    <div class="end-card">
        <h1>🎉 Congratulations!</h1>
        <h2>You fed both monsters!</h2>
        <div id="finalScore">Final Score: 0 / 18</div>
        <div id="starContainer">⭐</div>
        <button id="playAgainBtn" type="button">Play Again</button>
    </div>
</div>

<audio id="correctSound" preload="auto">
    <source src="assets/correct.mp3" type="audio/mpeg">
</audio>

<audio id="wrongSound" preload="auto">
    <source src="assets/wrong.mp3" type="audio/mpeg">
</audio>

<audio id="backgroundMusic" preload="auto" loop>
    <source src="assets/background music.mp3" type="audio/mpeg">
</audio>

<div id="loadingScreen">
    <div class="loading-box">Loading...</div>
</div>

<script src="script.js"></script>
</body>
</html>
